# Squid HTTP/HTTPS proxy configuration
# VPS Proxy Kit example configuration

# HTTP port
http_port 3128

# Access logging with custom format including bytes
logformat vpk %ts.%03tu %6tr %>a %Ss/%03>Hs %<st %rm %ru %[un %Sh/%<a %mt
access_log /var/log/vpk/squid_access.log vpk
cache_log /var/log/vpk/squid_cache.log

# Authentication via htpasswd file
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/vpk/htpasswd
auth_param basic children 5
auth_param basic realm VPS Proxy Kit
auth_param basic credentialsttl 2 hours

# ACL definitions
acl authenticated proxy_auth REQUIRED
acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 21          # ftp
acl Safe_ports port 443         # https
acl Safe_ports port 70          # gopher
acl Safe_ports port 210         # wais
acl Safe_ports port 1025-65535  # unregistered ports
acl Safe_ports port 280         # http-mgmt
acl Safe_ports port 488         # gss-http
acl Safe_ports port 591         # filemaker
acl Safe_ports port 777         # multiling http
acl CONNECT method CONNECT

# Access rules
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost manager
http_access deny manager
http_access allow authenticated
http_access deny all

# Performance and caching
cache_mem 256 MB
maximum_object_size 100 MB
cache_dir ufs /var/spool/squid 10000 16 256

# Disable caching for privacy (optional)
# cache deny all

# Headers
forwarded_for on
via on

# Service user
cache_effective_user proxyd
cache_effective_group proxyd

# Bandwidth limiting per user (optional)
# Uncomment to enable 32 KB/s (256 Kbps) per user limit
# delay_pools 1
# delay_class 1 2
# delay_parameters 1 -1/-1 32000/32000
# delay_access 1 allow authenticated
# delay_access 1 deny all

# Connection limits
client_lifetime 1 hour
pconn_timeout 60 seconds

# Workers (adjust based on CPU cores)
# workers 4

# Memory limits
memory_pools off
memory_pools_limit 64 MB
