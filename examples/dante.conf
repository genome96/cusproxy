# Dante SOCKS5 server configuration
# VPS Proxy Kit example configuration

logoutput: /var/log/vpk/danted.log

# Internal interface (listening)
internal: 0.0.0.0 port = 1080

# External interface (outgoing connections)
# Replace eth0 with your network interface
external: eth0

# Authentication methods
# username: require username/password authentication
socksmethod: username

# Service users
user.privileged: root
user.unprivileged: proxyd

# Client rules - who can connect to the SOCKS server
client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect disconnect error
}

# SOCKS rules - what the clients can do
socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    protocol: tcp udp
    command: bind connect udpassociate
    log: connect disconnect error data transfer
    socksmethod: username
}

# Block by default
socks block {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect error
}

# Performance tuning
child.maxidle: 30
child.maxrequests: 0

# Connection limits (optional)
# client.timeout: 86400
# io.timeout: 300
