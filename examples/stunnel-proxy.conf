# stunnel TLS wrapper configuration
# VPS Proxy Kit example configuration

# Global options
setuid = proxyd
setgid = proxyd
pid = /var/run/stunnel-vpk.pid
output = /var/log/vpk/stunnel.log

# TLS security options
sslVersion = TLSv1.3
options = NO_SSLv2
options = NO_SSLv3
options = NO_TLSv1
options = NO_TLSv1.1
options = NO_TLSv1.2

# Strong cipher suites (TLS 1.3)
ciphers = TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256

# HTTPS proxy (Squid with TLS)
[squid-https]
accept = 8443
connect = 127.0.0.1:3128
cert = /etc/vpk/certs/server.crt
key = /etc/vpk/certs/server.key
TIMEOUTclose = 0

# For Let's Encrypt certificates, use:
# cert = /etc/letsencrypt/live/proxy.example.com/fullchain.pem
# key = /etc/letsencrypt/live/proxy.example.com/privkey.pem

# Optional: Client certificate verification (mutual TLS)
# verify = 3
# CAfile = /etc/vpk/certs/client-ca.pem

# SOCKS5 with TLS
[socks5-tls]
accept = 11080
connect = 127.0.0.1:1080
cert = /etc/vpk/certs/server.crt
key = /etc/vpk/certs/server.key
TIMEOUTclose = 0

# Connection limits (optional)
# TIMEOUTbusy = 300
# TIMEOUTconnect = 30
# TIMEOUTidle = 43200
