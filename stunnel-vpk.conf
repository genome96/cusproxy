# stunnel TLS wrapper configuration
# Generated by VPS Proxy Kit

# Global options
setuid = proxyd
setgid = proxyd
output = /var/log/vpk/stunnel.log
foreground = yes
pid =

# TLS options (OpenSSL 3.0 compatible)
sslVersion = TLSv1.2
options = NO_SSLv2
options = NO_SSLv3
options = NO_TLSv1
options = NO_TLSv1_1
ciphers = HIGH:!aNULL:!MD5:!RC4

# HTTPS proxy (Squid with TLS)
[squid-https]
accept = 0.0.0.0:8443
connect = 127.0.0.1:3128
cert = /etc/vpk/certs/server.crt
key = /etc/vpk/certs/server.key
TIMEOUTclose = 0

# SOCKS5 with TLS
[socks5-tls]
accept = 0.0.0.0:11080
connect = 127.0.0.1:1080
cert = /etc/vpk/certs/server.crt
key = /etc/vpk/certs/server.key
TIMEOUTclose = 0
